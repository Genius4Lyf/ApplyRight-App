    <style>
      /* Boot screen only — replaced by React on mount. */
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f7f6f2;
        color: #111318;
        font-family: Georgia, "Times New Roman", serif;
      }
      .boot-mark {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.4px;
      }
      .boot-bar {
        width: 132px;
        height: 2px;
        overflow: hidden;
        background: rgba(17, 19, 24, 0.12);
      }
      .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: #111318;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(330%); }
      }
      /* The theme class is set by JS, which has not run yet — so the only thing that can
         match the user here is the system preference. Without this, someone on a dark
         phone gets a full-screen white flash before the app paints. */
      @media (prefers-color-scheme: dark) {
        .boot { background: #070c16; color: #f1f5f9; }
        .boot-bar { background: rgba(241, 245, 249, 0.16); }
        .boot-bar span { background: #f1f5f9; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar span { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>

    <!-- Dark-mode anti-flash guard: applies `.dark` before React mounts so an
         authenticated page hard-refreshed in dark mode never flashes light.
         Mirrors src/utils/theme.js (allow-list) and ThemeContext resolution.
         App default is LIGHT — this only ever adds `.dark` for an explicit
         stored 'dark' choice, never as a fallback. -->
    <script>
      (function () {
        try {
          var prefixes = [
            '/dashboard',
            '/onboarding',
            '/history',
            '/compare',
            '/profile',
            '/upgrade',
            '/credits',
            '/interview-prep',
            '/resume',
            '/my-cvs',
            '/cv-builder',
            '/aria-studio',
            '/feedback/dashboard',
            '/jobs',
            '/agent',
          ];
          var path = window.location.pathname;
          var eligible = prefixes.some(function (p) {
            return path === p || path.indexOf(p + '/') === 0;
          });
          if (!eligible) return;
          var stored = null;
          try {
            stored = localStorage.getItem('applyright-theme');
          } catch (e) {}
          var dark = stored === 'dark'; // default light; explicit 'dark' choice opts in
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <!-- Boot screen. #root was empty, so until the JS bundle downloaded, parsed and
         executed, the page was BLANK WHITE — several seconds on a mid-range Android over
         mobile data, with nothing at all to say the app was working. Users reported it as
         "the app takes time to open and shows no information", which is exactly what it
         did.

         Inline and tiny on purpose: an external stylesheet or image would be one more
         round trip before the thing whose job is to appear immediately. React replaces
         the whole of #root on mount, so nothing here needs removing.

         This does not make the app faster — it makes the wait legible. The bundle itself
         is the real fix. -->
    <div id="root">
      <div class="boot">
        <div class="boot-mark">ApplyRight</div>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
